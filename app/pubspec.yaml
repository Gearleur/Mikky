name: mikky
description: "Mikky, la mascotte qui vit en haut de l'écran."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  mikky_engine:
    path: ../packages/mikky_engine
  mikky_agents:
    path: ../packages/mikky_agents
  flutter_svg: ^2.0.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  assets:
    - assets/brands/
  shaders:
    - shaders/island.frag
  # Geist and Geist Mono, SIL Open Font License (assets/fonts/OFL.txt).
  fonts:
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist-Regular.ttf
        - asset: assets/fonts/Geist-Medium.ttf
          weight: 500
        - asset: assets/fonts/Geist-SemiBold.ttf
          weight: 600
    - family: Geist Mono
      fonts:
        - asset: assets/fonts/GeistMono-Regular.ttf
        - asset: assets/fonts/GeistMono-Medium.ttf
          weight: 500
    # Pixel fonts on trial for the app's name in the boards (user request,
    # 2026-09-30); keep the chosen one, delete the rest.
    - family: Bytesized
      fonts:
        - asset: assets/fonts/trial/Bytesized-400.ttf
    - family: DotGothic16
      fonts:
        - asset: assets/fonts/trial/DotGothic16-400.ttf
    - family: Doto
      fonts:
        - asset: assets/fonts/trial/Doto-400.ttf
        - asset: assets/fonts/trial/Doto-900.ttf
          weight: 900
    - family: Handjet
      fonts:
        - asset: assets/fonts/trial/Handjet-400.ttf
        - asset: assets/fonts/trial/Handjet-700.ttf
          weight: 700
    - family: Jacquard 12
      fonts:
        - asset: assets/fonts/trial/Jacquard12-400.ttf
    - family: Jersey 10
      fonts:
        - asset: assets/fonts/trial/Jersey10-400.ttf
    - family: Jersey 15
      fonts:
        - asset: assets/fonts/trial/Jersey15-400.ttf
    - family: Jersey 20
      fonts:
        - asset: assets/fonts/trial/Jersey20-400.ttf
    - family: Jersey 25
      fonts:
        - asset: assets/fonts/trial/Jersey25-400.ttf
    - family: Micro 5
      fonts:
        - asset: assets/fonts/trial/Micro5-400.ttf
    - family: Micro 5 Charted
      fonts:
        - asset: assets/fonts/trial/Micro5Charted-400.ttf
    - family: Press Start 2P
      fonts:
        - asset: assets/fonts/trial/PressStart2P-400.ttf
    - family: Silkscreen
      fonts:
        - asset: assets/fonts/trial/Silkscreen-400.ttf
        - asset: assets/fonts/trial/Silkscreen-700.ttf
          weight: 700
    - family: Sixtyfour
      fonts:
        - asset: assets/fonts/trial/Sixtyfour-400.ttf
    - family: Tiny5
      fonts:
        - asset: assets/fonts/trial/Tiny5-400.ttf
    - family: Workbench
      fonts:
        - asset: assets/fonts/trial/Workbench-400.ttf

name: mikky
description: "Mikky, la mascotte qui vit en haut de l'écran."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  mikky_engine:
    path: ../packages/mikky_engine
  mikky_agents:
    path: ../packages/mikky_agents
  flutter_svg: ^2.0.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  assets:
    - assets/brands/
  shaders:
    - shaders/island.frag
  # Geist and Geist Mono, SIL Open Font License (assets/fonts/OFL.txt).
  fonts:
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist-Regular.ttf
        - asset: assets/fonts/Geist-Medium.ttf
          weight: 500
        - asset: assets/fonts/Geist-SemiBold.ttf
          weight: 600
    - family: Geist Mono
      fonts:
        - asset: assets/fonts/GeistMono-Regular.ttf
        - asset: assets/fonts/GeistMono-Medium.ttf
          weight: 500
    # Pixel fonts on trial for the app's name in the boards (user request,
    # 2026-09-30); keep the chosen one, delete the rest.
    - family: Jacquard 12
      fonts:
        - asset: assets/fonts/trial/Jacquard12-400.ttf
    - family: Jacquard 24
      fonts:
        - asset: assets/fonts/trial/Jacquard24-400.ttf
    - family: Jacquarda Bastarda 9
      fonts:
        - asset: assets/fonts/trial/JacquardaBastarda9-400.ttf
    - family: Jersey 10
      fonts:
        - asset: assets/fonts/trial/Jersey10-400.ttf
    - family: Jersey 15
      fonts:
        - asset: assets/fonts/trial/Jersey15-400.ttf
    - family: Tiny5
      fonts:
        - asset: assets/fonts/trial/Tiny5-400.ttf
    - family: Workbench
      fonts:
        - asset: assets/fonts/trial/Workbench-400.ttf

name: mikky
description: "Mikky, la mascotte qui vit en haut de l'écran."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  mikky_engine:
    path: ../packages/mikky_engine
  mikky_agents:
    path: ../packages/mikky_agents
  flutter_svg: ^2.0.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  assets:
    - assets/brands/
  shaders:
    - shaders/island.frag
  # Geist and Geist Mono, SIL Open Font License (assets/fonts/OFL.txt).
  fonts:
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist-Regular.ttf
        - asset: assets/fonts/Geist-Medium.ttf
          weight: 500
        - asset: assets/fonts/Geist-SemiBold.ttf
          weight: 600
    - family: Geist Mono
      fonts:
        - asset: assets/fonts/GeistMono-Regular.ttf
        - asset: assets/fonts/GeistMono-Medium.ttf
          weight: 500
    # Fonts on trial in the boards (user request, 2026-09-30); keep the
    # chosen ones, delete the rest.
    - family: Hanken Grotesk
      fonts:
        - asset: assets/fonts/trial/HankenGrotesk-400.ttf
        - asset: assets/fonts/trial/HankenGrotesk-500.ttf
          weight: 500
        - asset: assets/fonts/trial/HankenGrotesk-600.ttf
          weight: 600
        - asset: assets/fonts/trial/HankenGrotesk-700.ttf
          weight: 700
    - family: Host Grotesk
      fonts:
        - asset: assets/fonts/trial/HostGrotesk-400.ttf
        - asset: assets/fonts/trial/HostGrotesk-500.ttf
          weight: 500
        - asset: assets/fonts/trial/HostGrotesk-600.ttf
          weight: 600
        - asset: assets/fonts/trial/HostGrotesk-700.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/trial/Inter-400.ttf
        - asset: assets/fonts/trial/Inter-500.ttf
          weight: 500
        - asset: assets/fonts/trial/Inter-600.ttf
          weight: 600
        - asset: assets/fonts/trial/Inter-700.ttf
          weight: 700
    - family: Jersey 10
      fonts:
        - asset: assets/fonts/trial/Jersey10-400.ttf
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/trial/JetBrainsMono-400.ttf
        - asset: assets/fonts/trial/JetBrainsMono-500.ttf
          weight: 500
    - family: Onest
      fonts:
        - asset: assets/fonts/trial/Onest-400.ttf
        - asset: assets/fonts/trial/Onest-500.ttf
          weight: 500
        - asset: assets/fonts/trial/Onest-600.ttf
          weight: 600
        - asset: assets/fonts/trial/Onest-700.ttf
          weight: 700
    - family: Pixelify Sans
      fonts:
        - asset: assets/fonts/trial/PixelifySans-400.ttf
        - asset: assets/fonts/trial/PixelifySans-500.ttf
          weight: 500
        - asset: assets/fonts/trial/PixelifySans-600.ttf
          weight: 600
        - asset: assets/fonts/trial/PixelifySans-700.ttf
          weight: 700
    - family: Schibsted Grotesk
      fonts:
        - asset: assets/fonts/trial/SchibstedGrotesk-400.ttf
        - asset: assets/fonts/trial/SchibstedGrotesk-500.ttf
          weight: 500
        - asset: assets/fonts/trial/SchibstedGrotesk-600.ttf
          weight: 600
        - asset: assets/fonts/trial/SchibstedGrotesk-700.ttf
          weight: 700
    - family: Silkscreen
